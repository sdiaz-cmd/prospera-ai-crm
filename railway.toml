[build]
builder = "NIXPACKS"
buildCommand = "npm install --legacy-peer-deps --ignore-engines && npm run build"

[deploy]
startCommand = "node --experimental-sqlite dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[mounts]]
mountPath = "/data"
